# 47 - Versioning & publishing your OWN action
#
# Once an action lives in its own repo, other people (and other repos of yours)
# consume it as `uses: your-org/your-action@SOMETHING`. This file is about what
# SOMETHING should be, and how to keep it sane.
#
# THE VERSIONING CONVENTION EVERYONE FOLLOWS:
#   * Cut a real semver RELEASE tag for each version:  v1.0.0, v1.1.0, v2.0.0.
#   * ALSO keep a MOVING MAJOR tag:  v1  ->  always points at the latest v1.x.
#   Consumers then choose their risk level:
#       @v1                -> auto-get non-breaking v1.x updates   (most people)
#       @v1.2.3            -> exact, never moves
#       @<full-sha>        -> maximum security pin                 (file 36)
#   A MAJOR bump (v1 -> v2) is your signal that something breaking changed, so
#   `@v1` users are never surprised.
#
# 🔑 THE MOVING-TAG TRICK: after publishing v1.4.0, you FORCE-move the `v1` tag
#    to the same commit. That is the whole maintenance job, and it's what the
#    release job below automates. Marketplace listings and Dependabot both rely
#    on this convention.
#
# PUBLISHING TO THE MARKETPLACE (a manual, one-time step, not YAML): draft a
# GitHub Release for the tag and tick "Publish this Action to the Marketplace".
# Requires a valid `action.yml` at the repo root with `name`, `description`, and
# `branding`.
#
# ⚠️ For a JS action you must publish the BUILT/bundled `dist/` (consumers don't
#    run npm install). This job includes an optional build-and-commit step for
#    exactly that; delete it if your action has no build.
#
# WHAT TO OBSERVE: create a release named `v1.2.0` (or push a `v1.2.0` tag) and
# watch this workflow re-point the `v1` tag at that commit, so `@v1` consumers
# immediately get 1.2.0.

name: 47 - Publish Custom Action

on:
  release:
    types: [published]         # fires when you publish a GitHub Release
  push:
    tags: ['v*.*.*']           # ...or when you push a semver tag directly

permissions:
  contents: write              # 🔑 needed to move the tag / push a commit

jobs:
  retag-major:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0       # need tags + history to move a tag

      - name: Work out the major tag (v1.4.0 -> v1)
        id: ver
        env:
          # release.tag_name on a release event, or the pushed ref otherwise.
          FULL_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          MAJOR="${FULL_TAG%%.*}"          # strips everything from the first dot
          echo "full=$FULL_TAG" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR"   >> "$GITHUB_OUTPUT"
          echo "Full tag: $FULL_TAG  ->  moving major tag: $MAJOR"

      # OPTIONAL — for a JS action, build & commit dist/ before tagging.
      # - uses: actions/setup-node@v6
      #   with: { node-version: '20' }
      # - run: npm ci && npm run build     # e.g. `ncc build index.js -o dist`

      - name: Force-move the major tag to this commit
        env:
          MAJOR: ${{ steps.ver.outputs.major }}
          FULL: ${{ steps.ver.outputs.full }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$FULL"       # v1 -> the commit that FULL points at
          git push origin "$MAJOR" --force
          echo "Consumers using @$MAJOR now get $FULL."
